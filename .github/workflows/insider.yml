name: polymarket-insider

# Detector liviano de "dinero informado": apuestas grandes de wallets con poco historial.
# Corre 4 minutos cada 5 y guarda en el repo los trades ya vistos.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-insider
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Traer el repo
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Vigilar 4 minutos
        working-directory: repo
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL: ${{ vars.DISCORD_CHANNEL }}
          MIN_USD: "300"
          PYTHONUNBUFFERED: "1"
        run: |
          code=0
          timeout 260 python3 -u insider.py || code=$?
          if [ "$code" = "124" ]; then echo "corte programado"; exit 0; fi
          exit $code

      - name: Guardar el estado
        working-directory: repo
        run: |
          git add -A vistos.json || true
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="polymarket-insider" -c user.email="bot@users.noreply.github.com" \
              commit -m "vistos $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then break; fi
            sleep 3
          done
